<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fafafa" />
  <meta name="description" content="重生之我觉醒了超级RC系统" />
  <title>重生之我觉醒了超级RC系统</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- 首页 -->
  <section id="home" class="screen active">
    <div class="home-inner">
      <h1 class="title">重生之我觉醒了超级rc系统</h1>
      <p class="enter-hint">点击进入</p>
    </div>
  </section>

  <!-- 主界面 -->
  <section id="main" class="screen">
    <button class="back" id="backBtn" aria-label="返回">‹</button>

    <div class="content">
      <button class="upload-box" id="uploadBtn">
        <span class="plus">+</span>
        <span class="upload-text">点击上传</span>
      </button>

      <div class="chapter-section">
        <div class="tabs" id="chapterTabs">
          <button class="tab active" data-tab="available">已有章节</button>
          <button class="tab" data-tab="pending">未更新</button>
          <button class="tab" data-tab="review">未审批</button>
        </div>

        <ul class="chapter-list tab-panel active" id="availableList"></ul>
        <ul class="chapter-list tab-panel" id="pendingList"></ul>
        <ul class="chapter-list tab-panel" id="reviewList"></ul>
      </div>
    </div>
  </section>

  <!-- 上传弹窗 -->
  <div class="modal-mask" id="uploadModal" hidden>
    <div class="modal">
      <h3 class="modal-title">上传章节</h3>

      <label class="field">
        <span class="field-label">章节名称</span>
        <input type="text" id="chapterName" placeholder="例如：新篇章" />
      </label>

      <label class="field">
        <span class="field-label">章节号</span>
        <input type="number" id="chapterNumber" placeholder="例如：11" min="1" />
      </label>

      <label class="field">
        <span class="field-label">章节文件</span>
        <span class="file-picker" id="filePicker">
          <span id="fileNameText">选择 .md 文件</span>
          <input type="file" id="chapterFile" accept=".md,text/markdown,text/plain" />
        </span>
      </label>

      <div class="modal-actions">
        <button class="btn ghost" id="cancelUpload">取消</button>
        <button class="btn solid" id="confirmUpload">确认上传</button>
      </div>
    </div>
  </div>

  <!-- 阅读界面 -->
  <section id="reader" class="screen">
    <div class="reader-header">
      <button class="back" id="readerBackBtn" aria-label="返回">‹</button>
      <h2 class="reader-title" id="readerTitle"></h2>
    </div>
    <article class="reader-body" id="readerBody"></article>
  </section>

  <script src="app.js"></script>
</body>
</html>
