<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fafafa" />
  <meta name="description" content="重生之我觉醒了超级RC系统" />
  <title>重生之我觉醒了超级RC系统</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- 首页 -->
  <section id="home" class="screen active">
    <div class="home-inner">
      <h1 class="title">重生之我觉醒了超级rc系统</h1>
      <p class="enter-hint">点击进入</p>
    </div>
  </section>

  <!-- 身份选择 -->
  <section id="auth" class="screen">
    <button class="back" id="authBackBtn" aria-label="返回">‹</button>

    <div class="auth-inner">
      <h2 class="auth-title">选择身份</h2>

      <div class="auth-choices" id="identityChoices">
        <button class="auth-btn" id="adminAuthBtn">管理员认证</button>
        <button class="auth-btn auth-btn-ghost" id="guestAuthBtn">游客访问</button>
      </div>

      <form class="key-form" id="keyForm" hidden>
        <label class="field">
          <span class="field-label">管理员密钥</span>
          <input type="password" id="adminKeyInput" placeholder="请输入密钥" autocomplete="off" />
        </label>
        <p class="key-error" id="keyError" hidden></p>
        <div class="modal-actions">
          <button type="button" class="btn ghost" id="keyCancelBtn">取消</button>
          <button type="submit" class="btn solid" id="keySubmitBtn">确认</button>
        </div>
      </form>
    </div>
  </section>

  <!-- 主界面 -->
  <section id="main" class="screen">
    <button class="back" id="backBtn" aria-label="返回">‹</button>
    <button class="admin-badge" id="adminBadge" hidden>管理员</button>

    <div class="content">
      <div class="upload-area">
        <div class="idea-grid">
          <button class="idea-block" id="provideIdeaBtn">提供idea</button>
          <button class="idea-block" id="previewIdeaBtn">idea预览</button>
        </div>

        <button class="upload-box" id="uploadBtn">
          <span class="plus">+</span>
          <span class="upload-text">点击上传</span>
        </button>
      </div>

      <div class="chapter-section">
        <div class="tabs" id="chapterTabs">
          <button class="tab active" data-tab="available">已有章节</button>
          <button class="tab" data-tab="pending">未更新</button>
          <button class="tab" data-tab="review">未审批</button>
        </div>

        <ul class="chapter-list tab-panel active" id="availableList"></ul>
        <ul class="chapter-list tab-panel" id="pendingList"></ul>
        <ul class="chapter-list tab-panel" id="reviewList"></ul>
      </div>
    </div>
  </section>

  <!-- 上传弹窗 -->
  <div class="modal-mask" id="uploadModal" hidden>
    <div class="modal">
      <h3 class="modal-title">上传章节</h3>

      <label class="field">
        <span class="field-label">章节名称</span>
        <input type="text" id="chapterName" placeholder="例如：新篇章" />
      </label>

      <label class="field">
        <span class="field-label">章节号</span>
        <input type="number" id="chapterNumber" placeholder="例如：11" min="1" />
      </label>

      <label class="field">
        <span class="field-label">章节文件</span>
        <span class="file-picker" id="filePicker">
          <span id="fileNameText">选择 .md 文件</span>
          <input type="file" id="chapterFile" accept=".md,text/markdown,text/plain" />
        </span>
      </label>

      <div class="modal-actions">
        <button class="btn ghost" id="cancelUpload">取消</button>
        <button class="btn solid" id="confirmUpload">确认上传</button>
      </div>
    </div>
  </div>

  <!-- 提供 idea 弹窗 -->
  <div class="modal-mask" id="ideaModal" hidden>
    <div class="modal">
      <h3 class="modal-title">提供 idea</h3>

      <label class="field">
        <span class="field-label">姓名</span>
        <input type="text" id="ideaNameInput" placeholder="请输入姓名" maxlength="20" />
      </label>

      <label class="field">
        <span class="field-label">内容（50字以内）</span>
        <textarea id="ideaTextInput" maxlength="50" rows="3" placeholder="写下你的 idea"></textarea>
        <span class="char-count" id="ideaCharCount">0/50</span>
      </label>

      <div class="modal-actions">
        <button class="btn ghost" id="ideaCancelBtn">取消</button>
        <button class="btn solid" id="ideaSubmitBtn">提交</button>
      </div>
    </div>
  </div>

  <!-- idea 预览弹窗 -->
  <div class="modal-mask" id="ideaPreviewModal" hidden>
    <div class="modal">
      <h3 class="modal-title">idea 预览</h3>
      <p class="preview-status" id="ideaPreviewStatus"></p>
      <div class="preview-list" id="ideaPreviewList"></div>
      <div class="modal-actions">
        <button class="btn solid" id="ideaPreviewCloseBtn">关闭</button>
      </div>
    </div>
  </div>

  <!-- GitHub 令牌弹窗 -->
  <div class="modal-mask" id="ghTokenModal" hidden>
    <div class="modal">
      <h3 class="modal-title">连接 GitHub</h3>
      <p class="gh-tip">同步 idea 需要 GitHub 令牌。令牌只保存在当前浏览器，不会上传到仓库。</p>
      <label class="field">
        <span class="field-label">GitHub 令牌</span>
        <input type="password" id="ghTokenInput" placeholder="ghp_..." autocomplete="off" />
      </label>
      <p class="gh-help">
        创建方法：GitHub → Settings → Developer settings → Personal access tokens →
        Generate new token（classic），勾选 public_repo，生成后粘贴到这里。
      </p>
      <div class="modal-actions">
        <button class="btn ghost" id="ghTokenCancelBtn">取消</button>
        <button class="btn solid" id="ghTokenSaveBtn">保存</button>
      </div>
    </div>
  </div>

  <!-- 阅读界面 -->
  <section id="reader" class="screen">
    <div class="reader-header">
      <button class="back" id="readerBackBtn" aria-label="返回">‹</button>
      <h2 class="reader-title" id="readerTitle"></h2>
    </div>
    <article class="reader-body" id="readerBody"></article>
  </section>

  <script src="app.js"></script>
</body>
</html>
